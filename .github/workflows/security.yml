name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # New advisories appear without any commit: re-scan every Monday 03:17 UTC.
    - cron: '17 3 * * 1'

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA. Security tools that are not actions are downloaded
# from their official GitHub release and verified against a pinned SHA-256 before they run.
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin, javascript-typescript, python ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks

      # Configuration and the one allowed test value live in .gitleaks.toml.
      - name: Scan the repository history for secrets
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency vulnerabilities (OSV-Scanner)
    runs-on: ubuntu-latest
    env:
      OSV_VERSION: 2.7.0
      OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install osv-scanner (checksum verified)
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check -
          chmod +x osv-scanner

      # Scans package-lock.json and the Maven pom. The AI service has no lockfile yet (planned S0-04), so it is
      # not covered until it has one.
      #
      # REPORT-ONLY for now: on 2026-10-29 the backend pom (Spring Boot 3.5.11) had 67 known advisories (9 critical, 23 high)
      # and even Boot 3.5.16 leaves 20 whose fixes need Tomcat 10.1.58+ / Spring Framework 7 (see KNOWN_ISSUES KI-063).
      # S0-03 (Spring Boot 4.1) removes `continue-on-error` so this becomes a blocking gate.
      - name: Scan lockfiles and manifests
        continue-on-error: true
        run: |
          set +e
          ./osv-scanner scan source --recursive ./ | tee osv-report.txt
          status=${PIPESTATUS[0]}
          { echo '### OSV-Scanner'; echo; echo '```'; tail -n 120 osv-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint (checksum verified)
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check -
          tar -xzf actionlint.tar.gz actionlint

      - name: Lint workflows
        run: ./actionlint -color

      - name: Every action reference is pinned to a full commit SHA
        run: |
          unpinned=$(grep -hE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "Unpinned actions:"; echo "$unpinned"; exit 1
          fi

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Backend SBOM
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DskipTests

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend SBOM
        working-directory: frontend
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file sbom-frontend.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            backend/target/bom.json
            frontend/sbom-frontend.cdx.json
          if-no-files-found: error

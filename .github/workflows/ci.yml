name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: no job needs to write to the repository.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (the comment names the release it points to).
jobs:
  backend:
    name: Backend (Java / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      # The backend tests start the real Python AI service to verify the Java <-> Python contract.
      - name: Set up Python 3.14 for the live AI contract tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install the AI service
        working-directory: ai
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Run Backend Tests and JaCoCo Coverage
        working-directory: backend
        env:
          FINGUARD_AI_PYTHON: python
          FINGUARD_REQUIRE_LIVE_AI: 'true'
        run: ./mvnw -B test

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React / TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Tests with Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Production Build
        working-directory: frontend
        run: npm run build

      # Blocking: a high or critical advisory in the dependency tree fails the build.
      - name: Security Audit
        working-directory: frontend
        run: npm audit --audit-level=high

  ai-service:
    name: AI Service (Python / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ai
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps .

      - name: Lint with Ruff
        working-directory: ai
        run: ruff check .

      - name: Run Tests
        working-directory: ai
        run: pytest -q

      - name: Evaluation metrics are current
        working-directory: ai
        run: python -m evaluation.evaluate --check

  staging-smoke:
    name: Reproducible Staging Smoke & Restore Drill (S0-08 / S0-09)
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Boot containerised staging stack
        run: |
          chmod +x scripts/staging-up.sh scripts/staging-down.sh
          ./scripts/staging-up.sh

      - name: Run end-to-end staging smoke workflow
        run: node scripts/staging-smoke.mjs

      - name: Rehearse PostgreSQL 18 backup and restore drill (S0-09)
        env:
          PG_CONTAINER: finguard-staging-postgres
          POSTGRES_DB: finguard_staging
          POSTGRES_USER: finguard_staging
        run: |
          chmod +x scripts/backup-db.sh scripts/restore-drill.sh
          ./scripts/restore-drill.sh

      - name: Dump staging logs on failure
        if: failure()
        run: docker compose -p finguard-staging --profile full -f docker-compose.yml -f docker-compose.staging.yml logs --no-color

      - name: Tear down staging stack and verify clean state
        if: always()
        run: ./scripts/staging-down.sh

# Local STAGING overlay. Isolated from the development stack: separate compose project (finguard-staging),
# separate container names, separate volume, loopback-only ports. Synthetic data only.
# Use through scripts/staging-up.ps1 (it generates throwaway secrets into .staging/staging.env).
services:
  postgres:
    container_name: finguard-staging-postgres
    ports: !override
      - "127.0.0.1:${STAGING_PG_PORT:-15433}:5432"

  ai:
    container_name: finguard-staging-ai
    environment:
      # The staging AI service must run authenticated: it refuses to start without AI_INTERNAL_TOKEN.
      AI_ENV: staging
    ports: !override
      - "127.0.0.1:${STAGING_AI_PORT:-18000}:8000"

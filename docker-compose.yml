# Local development infrastructure (default profile: postgres + ai) and full containerised stack (--profile full).
# Every value can be overridden through a root .env file (see .env.example).
services:
  postgres:
    image: postgres:18
    container_name: finguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
      POSTGRES_USER: ${POSTGRES_USER:-finguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_pass}
    ports:
      # Host port 5433 (not 5432) bound to 127.0.0.1 so it is not exposed to the local network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory (/var/lib/postgresql/18/docker): mount the parent.
      # A volume created by the old PostgreSQL 15 setup cannot be reused: docker compose down -v, then restore a dump.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build: ./ai
    container_name: finguard-ai
    environment:
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      # dev (default) may run without a token; staging/prod refuse to start without AI_INTERNAL_TOKEN (>= 32 chars).
      AI_ENV: ${AI_ENV:-dev}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # Rotation window: set to the old secret while the backend is moved to the new one, then clear it.
      AI_INTERNAL_TOKEN_PREVIOUS: ${AI_INTERNAL_TOKEN_PREVIOUS:-}
    ports:
      # Bound to 127.0.0.1 so the AI service is not accessible from the local network.
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    # The image defines its own HEALTHCHECK (GET /health).

  backend:
    build: ./backend
    container_name: finguard-backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finguard_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finguard_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-compose-jwt-secret-0123456789abcdef0123456789abcdef}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      MANAGEMENT_SERVER_PORT: 8081
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      # The frontend container (nginx) is the only client of the API on the container network and forwards the real client
      # address in X-Forwarded-For; trust the private container ranges so the login rate limiter sees real clients.
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,fd00::/8}
    ports:
      # Main API port bound to 127.0.0.1; management port 8081 stays internal to the container network.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: finguard-frontend
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: finguard-prometheus
    profiles: ["obs"]
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: finguard-grafana
    profiles: ["obs"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-finguard_obs}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:

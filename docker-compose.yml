# Local development infrastructure (default profile: postgres + ai) and full containerised stack (--profile full).
# Every value can be overridden through a root .env file (see .env.example).
services:
  postgres:
    image: postgres:18
    container_name: finguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finguard}
      POSTGRES_USER: ${POSTGRES_USER:-finguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finguard_pass}
    ports:
      # Host port 5433 (not 5432) bound to 127.0.0.1 so it is not exposed to the local network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build: ./ai
    container_name: finguard-ai
    environment:
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      # dev (default) may run without a token; staging/prod refuse to start without AI_INTERNAL_TOKEN (>= 32 chars).
      AI_ENV: ${AI_ENV:-dev}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      # Rotation window: set to the old secret while the backend is moved to the new one, then clear it.
      AI_INTERNAL_TOKEN_PREVIOUS: ${AI_INTERNAL_TOKEN_PREVIOUS:-}
    ports:
      # Bound to 127.0.0.1 so the AI service is not accessible from the local network.
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    # The image defines its own HEALTHCHECK (GET /health).

  backend:
    build: ./backend
    container_name: finguard-backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finguard_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finguard_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-compose-jwt-secret-0123456789abcdef0123456789abcdef}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      MANAGEMENT_SERVER_PORT: 8081
    ports:
      # Main API port bound to 127.0.0.1; management port 8081 stays internal to the container network.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: finguard-frontend
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"

volumes:
  postgres_data:

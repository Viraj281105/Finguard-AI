# FinGuard-AI Prometheus Configuration (S1-01 — Project E)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "finguard-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backend:8081"]
        labels:
          service: "backend"

  - job_name: "finguard-ai"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai:8000"]
        labels:
          service: "ai"


# Local development defaults. Never active when SPRING_PROFILES_ACTIVE=prod.
# Environment variables (SPRING_DATASOURCE_*, JWT_SECRET, ...) always override these values.

# Matches docker-compose.yml (postgres published on host port 5433 to avoid clashing with a local PostgreSQL on 5432).
spring.datasource.url=jdbc:postgresql://localhost:5433/finguard?TimeZone=UTC
spring.datasource.username=finguard_user
spring.datasource.password=finguard_pass

# Development-only signing key. Do not reuse anywhere that matters.
jwt.secret=${JWT_SECRET:finguard-dev-only-signing-key-change-me-0123456789abcdef}

logging.level.com.finguard=DEBUG
spring.jpa.show-sql=true

spring.application.name=backend
# Local development uses the "dev" profile. Set SPRING_PROFILES_ACTIVE=prod anywhere else:
# the prod profile has no built-in defaults, so DB credentials and JWT_SECRET must be supplied.
spring.profiles.default=dev

server.port=8080

# --- Database -----------------------------------------------------------------------------
# Connection settings come from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# (defaults for local development live in application-dev.properties).
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
# A database created by the old ddl-auto=update setup is adopted as baseline V1 instead of failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Uploads (the frontend also enforces 5 MB) ---------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Security --------------------------------------------------------------------------------
# Required: no default here. JWT_SECRET must be at least 32 bytes.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- AI service (Python/FastAPI) ---------------------------------------------------------------
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout=5s
ai.service.read-timeout=30s
ai.service.batch-size=200
# Time budget for one classification call across all batches; the client also stops after two
# consecutive failed batches, so a dead AI service cannot stall an import.
ai.service.max-total-duration=90s
# Shared secret sent as X-Internal-Token. Must equal AI_INTERNAL_TOKEN of the AI service; empty = no header.
ai.service.internal-token=${AI_INTERNAL_TOKEN:}

# --- Recommendation thresholds (v0.10.0) ------------------------------------------------------
# All optional; the defaults are documented in docs/FINANCIAL_RULES.md section 9 and are general-guidance
# heuristics, not advice. Override with environment variables, e.g. RECOMMENDATIONS_MIN_SAVINGS_RATE_PERCENT=25.

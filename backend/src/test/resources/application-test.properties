# Test profile: datasource comes from TestPostgres (embedded PostgreSQL).
jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef
# Nothing listens here, so classification exercises the "AI service unavailable" fallback by default.
ai.service.url=http://localhost:1
ai.service.connect-timeout=1s
ai.service.read-timeout=1s
logging.level.org.springframework.security=WARN
# Disable separate management server in MockMvc tests; ActuatorHealthProbeTest overrides this with port 0.
management.server.port=-1
